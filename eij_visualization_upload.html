<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EI/J Policy — Energy & Operator Inspector</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#8b949e;--grid:#21262d;
    --learned:#3fb950;--star:#f85149;--conn:#58a6ff;--accent:#d29922;
    --fast:#58a6ff;--medium:#d29922;--slow:#f85149;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px;line-height:1.5}
  h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .wrap{max-width:1040px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:20px;margin-bottom:16px}
  .controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  button{background:#21262d;color:var(--ink);border:1px solid #30363d;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer;transition:.15s}
  button:hover{background:#30363d}
  button.play{background:var(--learned);color:#03130a;border-color:var(--learned);font-weight:600}
  .slider{flex:1;min-width:180px;accent-color:var(--learned)}
  .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;margin-top:6px}
  .lg{display:flex;align-items:center;gap:6px}.sw{width:14px;height:3px;border-radius:2px;display:inline-block}
  svg{width:100%;height:auto;display:block}
  .axlab{fill:var(--muted);font-size:11px}.gridline{stroke:var(--grid);stroke-width:1;stroke-dasharray:2 3;opacity:.5}
  .trace{fill:none;stroke-width:2.5}.switch-tick{fill:var(--accent)}
  .switch-lab{fill:var(--muted);font-size:9px;text-anchor:middle}
  .cursor{stroke:var(--ink);stroke-width:1;opacity:.4;stroke-dasharray:3 3}.drone{fill:var(--learned)}
  .cols{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
  @media(max-width:820px){.cols{grid-template-columns:1fr}}
  .opcard{background:#0d1117;border:1px solid var(--grid);border-radius:10px;padding:16px}
  .ophead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .opname{font-size:19px;font-weight:700}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
  .b-fast{background:rgba(88,166,255,.15);color:var(--fast);border:1px solid var(--fast)}
  .b-medium{background:rgba(210,153,34,.15);color:var(--medium);border:1px solid var(--medium)}
  .b-slow{background:rgba(248,81,73,.15);color:var(--slow);border:1px solid var(--slow)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--grid)}
  .kv .k{color:var(--muted)}.kv .v{font-weight:600;font-variant-numeric:tabular-nums}
  .why{font-size:12px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px solid var(--grid)}
  .why b{color:var(--ink)}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
  th,td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
  td.p,th.p{text-align:left}
  tr.active td{background:rgba(63,185,80,.12)}
  tr{cursor:pointer}tr:hover td{background:rgba(255,255,255,.03)}
  .tbwrap{max-height:280px;overflow:auto;border:1px solid var(--grid);border-radius:8px}
  .pill{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .drop{border:2px dashed #30363d;border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:13px;transition:.15s;cursor:pointer}
  .drop.over{border-color:var(--learned);background:rgba(63,185,80,.06);color:var(--ink)}
  .fname{color:var(--learned);font-weight:600}
  .stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
  .stat{background:#0d1117;border:1px solid var(--grid);border-radius:8px;padding:12px}
  .stat .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .stat .val{font-size:22px;font-weight:700;margin-top:2px}.stat .s2{font-size:12px;color:var(--muted)}
  .err{color:var(--star);font-size:13px;margin-top:8px}
</style></head>

// ---- CSV parser (simple, handles our clean numeric CSV) ----
function parseCSV(text){
  const lines=text.trim().split(/\r?\n/);
  const head=lines[0].split(',');
  const rows=lines.slice(1).map(l=>{const c=l.split(',');const o={};head.forEach((h,i)=>o[h]=c[i]);return o;});
  return {head,rows};
}
const NUM=['step','frac','resolution','range','threads','battery_fraction','plan_time_s',
  'hover_J','flight_J','cumulative_J','path_length','waypoints','smoothness','clear_min','collision_checks'];
function toPolicy(rows,name){
  const r=rows.filter(x=>x.policy===name).sort((a,b)=>(+a.step)-(+b.step));
  const g=k=>r.map(x=>NUM.includes(k)?(x[k]===''||x[k]==null?null:+x[k]):x[k]);
  return {frac:g('frac'),cum:g('cumulative_J'),batt:g('battery_fraction'),hover:g('hover_J'),
    flight:g('flight_J'),planner:g('planner'),res:g('resolution'),tier:g('tier'),rng:g('range'),
    threads:g('threads'),waypoints:g('waypoints'),pathlen:g('path_length'),clear:g('clear_min'),
    plan_ms:g('plan_time_s').map(v=>v==null?null:+(v*1000).toFixed(1)),is_opt:g('is_opt'),
    cchk:g('collision_checks'),src:g('source'),n:r.length};
}

let L,S,C,N;
function ingest(text,fname){
  try{
    const {head,rows}=parseCSV(text);
    const req=['policy','step','frac','planner','cumulative_J','battery_fraction'];
    const miss=req.filter(c=>!head.includes(c));
    if(miss.length){document.getElementById('err').textContent='Missing columns: '+miss.join(', ');return false;}
    const pols=[...new Set(rows.map(r=>r.policy))];
    L=toPolicy(rows,'learned');
    S=pols.includes('rrtstar')?toPolicy(rows,'rrtstar'):null;
    C=pols.includes('rrtconnect')?toPolicy(rows,'rrtconnect'):null;
    if(!L.n){document.getElementById('err').textContent="No 'learned' policy rows found.";return false;}
    N=L.n;
    document.getElementById('err').textContent='';
    document.getElementById('meta').textContent=`Showing ${N} steps · policies: ${pols.join(', ')}`;
    if(fname)document.getElementById('fileinfo').innerHTML='Loaded <span class="fname">'+fname+'</span>';
    document.getElementById('scrub').max=N-1;
    setup();render(N-1);
    return true;
  }catch(e){document.getElementById('err').textContent='Parse error: '+e.message;return false;}
}

// ---- chart geometry ----
const W=900,H=360,m={l:64,r:20,t:18,b:42},iw=W-m.l-m.r,ih=H-m.t-m.b;
let maxE=1;
const xi=i=>m.l+(i/(N-1))*iw, Y=e=>m.t+ih-(e/maxE)*ih;
const svg=document.getElementById('chart'),NS='http://www.w3.org/2000/svg';
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const TIERCLR={fast:'--fast',medium:'--medium',slow:'--slow'};
function setup(){
  const all=[...L.cum,...(S?S.cum:[]),...(C?C.cum:[])].filter(v=>v!=null);
  maxE=Math.max(...all)*1.05;drawStatic();
}
function drawStatic(){
  svg.innerHTML='';
  for(let g=0;g<=5;g++){const e=maxE*g/5,y=Y(e);
    svg.appendChild(el('line',{class:'gridline',x1:m.l,y1:y,x2:W-m.r,y2:y}));
    const t=el('text',{class:'axlab',x:m.l-8,y:y+4,'text-anchor':'end'});t.textContent=(e/1000).toFixed(0)+'k';svg.appendChild(t);}
  for(let g=0;g<=5;g++){const fr=g/5,x=m.l+fr*iw;const t=el('text',{class:'axlab',x:x,y:H-14,'text-anchor':'middle'});t.textContent=(fr*90|0)+'%';svg.appendChild(t);}
  svg.appendChild(el('text',{class:'axlab',x:16,y:m.t+ih/2,transform:`rotate(-90 16 ${m.t+ih/2})`,'text-anchor':'middle'})).textContent='Cumulative energy (J)';
}
const pathFor=(a,u)=>{let d='';for(let i=0;i<=u;i++){const j=Math.min(i,a.cum.length-1);const v=a.cum[j];if(v==null)break;d+=(i?'L':'M')+xi(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';}return d;};
let TL,SL,CL;
function drawTraces(u){
  [TL,SL,CL].forEach(l=>l&&l.remove());TL=el('g',{});SL=el('g',{});CL=el('g',{});
  if(S)TL.appendChild(el('path',{class:'trace',d:pathFor(S,N-1),stroke:'var(--star)',opacity:.85}));
  if(C)TL.appendChild(el('path',{class:'trace',d:pathFor(C,N-1),stroke:'var(--conn)',opacity:.85}));
  TL.appendChild(el('path',{class:'trace',d:pathFor(L,u),stroke:'var(--learned)'}));
  let prev=null;
  for(let i=0;i<=u;i++){const p=L.planner[i];if(p!==prev){const x=xi(i),y=Y(L.cum[i]);
    SL.appendChild(el('circle',{class:'switch-tick',cx:x,cy:y,r:3.5}));
    const t=el('text',{class:'switch-lab',x:x,y:y-9});t.textContent=p;SL.appendChild(t);prev=p;}}
  for(let i=0;i<N;i++){const c=el('circle',{cx:xi(i),cy:Y(L.cum[i]),r:8,fill:'transparent',style:'cursor:pointer'});c.addEventListener('click',()=>{stop();render(i);});SL.appendChild(c);}
  const cx=xi(u),cy=Y(L.cum[u]);
  CL.appendChild(el('line',{class:'cursor',x1:cx,y1:m.t,x2:cx,y2:m.t+ih}));
  CL.appendChild(el('circle',{class:'drone',cx:cx,cy:cy,r:5}));
  svg.appendChild(TL);svg.appendChild(SL);svg.appendChild(CL);
}
const kv=(k,v)=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;
const RESN={0.0005:'fine',0.002:'medium',0.008:'coarse'};
// safe baseline read: if a baseline ended early (dead battery), clamp to its
// last real step instead of reading past the array end (which gives NaN).
function at(arr,i){ if(!arr)return null; const j=Math.min(i,arr.length-1); return arr[j]; }
function inspector(i){
  document.getElementById('opname').textContent=L.planner[i];
  const tier=L.tier[i],b=document.getElementById('optier');b.textContent=tier;b.className='badge b-'+tier;
  const rn=RESN[L.res[i]]||L.res[i];
  document.getElementById('opkv').innerHTML=
    kv('Resolution',`${rn} (${L.res[i]})`)+kv('Range',L.rng[i])+kv('Threads',L.threads[i])+
    kv('Optimizing?',L.is_opt[i]||'—')+kv('Waypoints',L.waypoints[i]??'—')+kv('Path length',L.pathlen[i])+
    kv('Min clearance',L.clear[i])+kv('Collision checks',(L.cchk[i]??0).toLocaleString())+
    kv('Plan time',(L.plan_ms[i]??'—')+' ms')+kv('Hover energy',(L.hover[i]??'—')+' J')+
    kv('Est. source',L.src[i]||'—')+kv('Battery left',(L.batt[i]*100).toFixed(0)+'%');
  const saved=S?(at(S.cum,i)-L.cum[i]):0;
  document.getElementById('opwhy').innerHTML=
    `At <b>${(i/(N-1)*90|0)}%</b> of the route with <b>${(L.batt[i]*100).toFixed(0)}%</b> battery, the policy chose `+
    `<b>${L.planner[i]}</b> (${tier} tier) at <b>${rn}</b> resolution. `+
    (tier==='fast'?`It skipped the heavy optimizing planners here — their hover cost isn't worth the marginal path gain at this state. `:
     tier==='slow'?`Battery was high enough to afford the extra hover time for a better path. `:
     `A middle-tier planner balanced path quality against hover cost. `)+
    (S?`Cumulative energy saved vs always-RRT* so far: <b>${(saved/1000).toFixed(1)} kJ</b>.`:'');
}
function stats(i){
  const wrap=document.getElementById('stats');
  if(!S){wrap.innerHTML='';return;}
  const bl=(L.batt[i]*100).toFixed(0),bs=(at(S.batt,i)*100).toFixed(0);
  const saved=(at(S.cum,i)-L.cum[i]),gap=(L.batt[i]-at(S.batt,i))*100;
  wrap.innerHTML=
    `<div class="stat"><div class="lab">EI/J battery left</div><div class="val" style="color:var(--learned)">${bl}%</div><div class="s2">at ${(i/(N-1)*90|0)}% of route</div></div>`+
    `<div class="stat"><div class="lab">Always-RRT* battery</div><div class="val" style="color:var(--star)">${bs}%</div><div class="s2">same point</div></div>`+
    `<div class="stat"><div class="lab">Energy saved vs RRT*</div><div class="val" style="color:var(--accent)">${(saved/1000).toFixed(1)}kJ</div><div class="s2">+${gap.toFixed(0)} pts battery</div></div>`;
}
function buildTable(){
  const tb=document.getElementById('tbody');tb.innerHTML='';
  for(let i=0;i<N;i++){const tr=document.createElement('tr');tr.id='row'+i;
    const clr=`var(${TIERCLR[L.tier[i]]||'--muted'})`;
    tr.innerHTML=`<td class="p">${i+1}</td><td class="p"><span class="pill" style="background:${clr}"></span>${L.planner[i]}</td>`+
      `<td>${RESN[L.res[i]]||L.res[i]}</td><td>${L.waypoints[i]??'—'}</td><td>${L.pathlen[i]}</td><td>${L.clear[i]}</td><td>${(L.batt[i]*100).toFixed(0)}%</td>`;
    tr.addEventListener('click',()=>{stop();render(i);});tb.appendChild(tr);}
}
let cur=0,timer=null;
function render(i){cur=i;buildTable();drawTraces(i);inspector(i);stats(i);
  document.getElementById('scrub').value=i;
  document.getElementById('pct').textContent=`${(i/(N-1)*90|0)}% flown · step ${i+1}/${N}`;
  document.querySelectorAll('#tbody tr').forEach(r=>r.classList.remove('active'));
  const row=document.getElementById('row'+i);if(row){row.classList.add('active');row.scrollIntoView({block:'nearest'});}
}
function stop(){if(timer){clearInterval(timer);timer=null;document.getElementById('play').textContent='▶ Fly mission';}}
document.getElementById('scrub').addEventListener('input',e=>{stop();render(+e.target.value);});
document.getElementById('reset').addEventListener('click',()=>{stop();render(0);});
document.getElementById('play').addEventListener('click',()=>{
  if(timer){stop();return;}if(cur>=N-1)cur=0;
  document.getElementById('play').textContent='❚❚ Pause';
  timer=setInterval(()=>{if(cur>=N-1){stop();return;}render(cur+1);},360);
});
// upload wiring
const drop=document.getElementById('drop'),file=document.getElementById('file');
drop.addEventListener('click',()=>file.click());
file.addEventListener('change',e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>{stop();ingest(r.result,f.name);};r.readAsText(f);}});
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f){const r=new FileReader();r.onload=()=>{stop();ingest(r.result,f.name);};r.readAsText(f);}});
// load default
ingest(DEFAULT_CSV,'demo_steps.csv (pre-loaded)');
</script></body></html>
